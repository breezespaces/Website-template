components:
  schemas:
    AccountResolution:
      type: object
      properties:
        account_name:
          type: string
          readOnly: true
        account_number:
          type: string
          maxLength: 20
      required:
      - account_name
      - account_number
    AccountResolutionRequest:
      type: object
      properties:
        account_number:
          type: string
          minLength: 1
          maxLength: 20
        bank_code:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 20
      required:
      - account_number
      - bank_code
    AddBankAccount:
      type: object
      properties:
        detail:
          allOf:
          - $ref: '#/components/schemas/BusinessBankAccount'
          readOnly: true
      required:
      - detail
    AddBankAccountRequest:
      type: object
      properties:
        account_number:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 20
        bank_code:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 20
        bank_name:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 200
        set_default:
          type: boolean
          writeOnly: true
          default: true
      required:
      - account_number
      - bank_code
      - bank_name
    AddToCart:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,4})?$
          readOnly: true
        item_count:
          type: integer
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - item_count
      - items
      - total
      - updated_at
    AddToCartRequest:
      type: object
      properties:
        variant_id:
          type: string
          format: uuid
          writeOnly: true
        quantity:
          type: integer
          minimum: 1
          writeOnly: true
          default: 1
      required:
      - variant_id
    AddressTypeEnum:
      enum:
      - home
      - work
      - other
      type: string
      description: |-
        * `home` - Home
        * `work` - Work
        * `other` - Other
    BankList:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
      required:
      - code
      - id
      - name
    BusinessBankAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        account_name:
          type: string
          maxLength: 200
        account_number:
          type: string
          maxLength: 20
        bank_name:
          type: string
          maxLength: 200
        bank_code:
          type: string
          maxLength: 20
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
